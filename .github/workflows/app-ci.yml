name: App CI

on:
  push:
    branches: [main, dev, "feature/**"]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      - ".github/actions/deploy-ecs/**"
      - ".github/actions/deploy-ecs-task/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      - ".github/actions/deploy-ecs/**"
      - ".github/actions/deploy-ecs-task/**"

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/poetry.lock

      - name: Install dependencies
        run: |
          pip install 'poetry==2.1.4'
          poetry install --with dev

      - name: Run unit tests (services/gateway)
        run: poetry run python -m unittest discover -s services/gateway/tests -t .

      - name: Run load/chaos scenario tests (M6)
        run: poetry run python -m unittest discover -s loadtests -t .

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gateway-api:ci .

      - name: Run container
        run: |
          docker run -d --name gateway-api-ci -p 8080:8080 gateway-api:ci

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz; then
              echo "gateway is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "gateway did not become healthy in time"
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs gateway-api-ci

      - name: Stop container
        if: always()
        run: docker rm -f gateway-api-ci

  # --- Security scanning (plan section 35.9, P2 production hardening) ---
  #
  # Deliberately NOT in deploy-dev's `needs:` -- gating deploy on these
  # from day one would immediately block on whatever pre-existing
  # findings this first run surfaces, before anyone's had a chance to
  # triage them. Findings land in the repo's Security tab (CodeQL/
  # Trivy both upload SARIF); making a specific severity threshold
  # deploy-blocking is a deliberate follow-up once there's a baseline
  # to gate against, not something to flip on blind.

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # CodeQL's diff-informed-queries feature calls GET on the
      # current workflow run (docs.github.com/rest/actions/
      # workflow-runs#get-a-workflow-run, under the Actions API) even
      # on a plain push trigger, not just pull_request -- without
      # this the analyze step still produces a valid SARIF but then
      # fails the job with "Resource not accessible by integration"
      # trying to fetch that run's context afterward. Live-verified.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          source-root: app
      - uses: github/codeql-action/analyze@v3

  pip-audit:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install 'poetry==2.1.4'
          # Poetry 2.0 stopped bundling `export` -- it's an optional
          # plugin now, not built in. Without this, `poetry export`
          # below fails immediately with "The requested command
          # export does not exist." Live-verified in CI.
          poetry self add poetry-plugin-export
          poetry install --with dev
      - name: Export requirements from poetry.lock
        run: poetry export --with dev -f requirements.txt -o requirements-audit.txt --without-hashes
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements-audit.txt --desc

  trivy:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # Same gap as the codeql job's actions: read comment above --
      # upload-sarif hits the identical workflow-run telemetry call
      # analyze does.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        working-directory: app
        run: docker build -t gateway-api:trivy-scan .
      # Explicit repo-root-relative paths on both this step's output
      # and upload-sarif's sarif_file below -- a job-level
      # defaults.run.working-directory does NOT apply to a `uses:`
      # step's `with:` inputs, only to `run:` steps. Learned live in
      # this same platform (platform-authz-service/platform-
      # control-plane's identical Trivy jobs both hit this: the
      # trivy-action step wrote to repo root regardless of any
      # job-level default, while upload-sarif looked in a
      # subdirectory, or vice versa -- fixed there the same way).
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gateway-api:trivy-scan
          format: sarif
          output: app/trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/trivy-results.sarif

  deploy-dev:
    name: Deploy to dev
    needs: [test, docker]
    # Auto-deploys on every push to main, same pattern as this repo's
    # own infra-ci.yml apply-dev -- there is no long-lived "dev"
    # branch in this repo, so a trigger on refs/heads/dev never fired.
    #
    # Prod is deliberately NOT triggered from this push at all (not
    # even behind an approval gate on the same run) -- see
    # app-promote-prod.yml. A push to main only ever proves out dev; a
    # prod release is always a separate, explicit action that promotes
    # a specific already-validated image, never a rebuild of whatever
    # main happens to be at approval time.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ecs
        with:
          aws-region: us-east-1
          deploy-role-arn: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN_DEV }}
          ecr-repository: gateway-dev
          ecs-cluster: gateway-dev-cluster
          ecs-service: gateway-dev-service
          task-definition-family: gateway-dev
          container-name: gateway-api
          working-directory: app

      # M7: same image deploy-ecs just built and pushed above, run as
      # the worker instead of gateway-api (see this repo's own
      # infra/modules/worker_service) -- not a second build.
      - uses: ./.github/actions/deploy-ecs-task
        with:
          ecr-repository: gateway-dev
          image-tag: sha-${{ github.sha }}
          ecs-cluster: gateway-dev-cluster
          ecs-service: gateway-dev-worker-service
          task-definition-family: gateway-dev-worker
          container-name: gateway-worker
