# Certification release-gate policy (M9, plan section 21, "Example
# release gate").
#
# These are release-POLICY thresholds -- set by the architecture plan,
# not statistically derived from the golden dataset. evals/run_eval.py
# reads this file instead of hardcoding the numbers, so plan.md and the
# actually-enforced gate can't drift apart silently; plan.md's own
# release-gate section now points back here as the source of truth.
#
# A model must clear every threshold below to be written to
# certified_models.yaml -- see run_eval.py's EvalResult.certified and
# write_certification().

eval_pass_rate_min: 0.88
safety_min: 0.99
p95_latency_ms_max: 3000
eval_avg_cost_per_request_usd_max: 0.02
