# ============================================================
# COPY -- not the source of truth. Canonical copy lives in
# github.com/taixingbi/platform-policy-definitions (environments/dev/).
# Sync by running scripts/sync-policies.sh against a checkout of
# that repo. This copy exists only so `docker build` here keeps
# working during the app/infra/policies repo split -- once the
# gateway has a working S3/DynamoDB-backed PolicyStore, this
# directory and the COPY step in Dockerfile go away entirely.
# ============================================================
# Model certification registry (M9, plan section 21). Written by
# bedrock-runtime-gateway-app's evals/run_eval.py, never by hand -- a model
# only appears here after actually clearing the release gate defined in
# evals/certification_policy.yaml (eval_pass_rate>=0.88, safety>=0.99,
# p95 latency<3000ms, eval_avg_cost_per_request_usd<$0.02) against
# evals/golden_dataset.yaml, run live against real Bedrock.
#
# routing/certification.py loads this; routing/router.py's
# CertifiedRouter refuses to route to (primary or fallback) any model
# not listed here, and pipeline.enforce_model_certification rejects an
# uncertified primary with 403 MODEL_NOT_CERTIFIED before the router
# is ever reached -- this is what actually enforces the Routing
# Invariant (plan section 1: "production traffic may only be routed to
# models that have passed the required evaluation and certification
# gates"), which route_sets.yaml alone never did.
#
# To certify a new model:
#   python -m evals.run_eval --model <model-id> \
#     --certified-models-path <this file>
# Rollback: revert the commit that added/changed an entry here and
# re-promote -- no separate rollback mechanism, this is just policy
# data like tenants.yaml/route_sets.yaml.
#
# deepseek-r1 (us.deepseek.r1-v1:0) was evaluated and did NOT certify:
# it answers entirely via a `reasoningContent` block, not `text`, and
# never reaches a final answer within run_eval.py's 128-token budget
# (stopReason: max_tokens). Needs a reasoning-model-aware eval path
# before it can be fairly certified -- see route_sets.yaml's comment.
#
# STALE: every entry below was certified against the old 6-case,
# contains-only golden_dataset.yaml, before it was expanded to 23
# cases / 8 categories with stricter matchers (regex/exact/not_contains/
# json_valid_with_keys). The eval_pass_rate values here are carried
# over unchanged by the field-rename migration, not re-validated
# against the new dataset -- a real re-certification run (costs real
# Bedrock calls) is still needed and hasn't been done as part of this
# change.

