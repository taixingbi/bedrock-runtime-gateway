# ============================================================
# COPY -- not the source of truth. Canonical copy lives in
# github.com/taixingbi/platform-policy-definitions (environments/dev/).
# Sync by running scripts/sync-policies.sh against a checkout of
# that repo. This copy exists only so `docker build` here keeps
# working during the app/infra/policies repo split -- once the
# gateway has a working S3/DynamoDB-backed PolicyStore, this
# directory and the COPY step in Dockerfile go away entirely.
# ============================================================
# IAM principal -> tenant policy mapping (AWS_IAM/SigV4 auth path).
#
# The JWT path gets tenant_id/application_id/roles directly from a
# verified token's claims (see auth/identity.py). A verified AWS IAM
# principal ARN carries none of that, so this file is the IAM-path
# equivalent of tenants.yaml: it says which tenant policy (still looked
# up by tenant_id in tenants.yaml, unchanged) an already-authenticated
# IAM caller gets mapped to, and which roles they're granted for
# pipeline.authorize()'s RBAC check.
#
# Loaded once at startup by FileIamTenantResolver (see auth/aws_iam.py).
# An ARN ending in "*" matches any principal ARN sharing that prefix --
# used for assumed-role ARNs, since the session-name suffix
# ("arn:...:assumed-role/<role>/<session-name>") is caller-chosen and
# can't be enumerated in advance.
#
# A principal calling in via the AWS_IAM route with no entry here 403s
# with UNKNOWN_IAM_PRINCIPAL -- add an entry (and grant that principal
# execute-api:Invoke on the /iam/* route, see infra/README.md) before
# a new caller can use this path.

# Corrected 2026-09-24 (was wrongly emptied to {} on 2026-09-23): only
# the two *exact*-role-ARN entries that used to live here are actually
# redundant with DynamoDB (gateway-principal-grants-dev) -- both
# DynamoDbIamTenantResolver implementations in this platform
# (bedrock-runtime-gateway's auth/aws_iam.py and this repo's sibling
# platform-authz-service/attributes/resolver.py) do an exact-match
# get_item() only, by deliberate design (see aws_iam.py's own
# docstring: "the '*' session-name-wildcard case ... only makes sense
# for hand-authored, review-gated entries"). Storing the literal string
# ".../finance-manual-smoke-test/*" as a DynamoDB item key does NOT
# make it wildcard-match a real per-session ARN -- that only happens in
# FileIamTenantResolver's own prefix-matching code. So the two
# assumed-role wildcard entries below are NOT a migration-phase
# leftover; they are the only mechanism that can ever serve an
# assumed-role caller, permanently, regardless of what's in DynamoDB.
# (Caught live: emptying this file broke the finance-manual-smoke-test
# smoke test, which always calls in via `aws sts assume-role` -- see
# scripts/smoke-test-iam.sh.)
iam_principals:
  # Manual curl/smoke testing against the tenant1-finance tenant
  # (dev only) -- has a real monthly_budget (tenants.yaml), so this is
  # the entry to use to see an actual model response rather than an
  # immediate BUDGET_EXCEEDED. Assumed via `aws sts assume-role` from
  # the taixingbi user (see the role's trust policy). The exact-ARN
  # form (no assume-role) is deliberately NOT restored here -- that one
  # really is served correctly by DynamoDB's exact-match lookup.
  "arn:aws:sts::646821141010:assumed-role/finance-manual-smoke-test/*":
    tenant_id: tenant1-finance
    application_id: finance-manual-smoke-test
    roles: [developer, operator]

  # Manual curl/smoke testing of plan section 30's ABAC retrofit --
  # tenant_id: tenant1-finance + roles: [manager] should be able to
  # see/change this tenant's own admin data (GET /v1/admin/usage,
  # /v1/admin/tenants, PUT /v1/admin/tenants/tenant1-finance/state) but
  # get 403 acting on any other tenant, unlike finance-manual-smoke-test
  # above (developer only, can't reach /v1/admin/* at all).
  "arn:aws:sts::646821141010:assumed-role/finance-manager-smoke-test/*":
    tenant_id: tenant1-finance
    application_id: finance-manager-smoke-test
    roles: [manager]
