# gateway has a working S3/DynamoDB-backed PolicyStore, this
# directory and the COPY step in Dockerfile go away entirely.
# ============================================================
# IAM principal -> tenant policy mapping (AWS_IAM/SigV4 auth path).
#
# The JWT path gets tenant_id/application_id/roles directly from a
# verified token's claims (see auth/identity.py). A verified AWS IAM
# principal ARN carries none of that, so this file is the IAM-path
# equivalent of tenants.yaml: it says which tenant policy (still looked
# up by tenant_id in tenants.yaml, unchanged) an already-authenticated
# IAM caller gets mapped to, and which roles they're granted for
# pipeline.authorize()'s RBAC check.
#
# Loaded once at startup by FileIamTenantResolver (see auth/aws_iam.py).
# An ARN ending in "*" matches any principal ARN sharing that prefix --
# used for assumed-role ARNs, since the session-name suffix
# ("arn:...:assumed-role/<role>/<session-name>") is caller-chosen and
# can't be enumerated in advance.
#
# A principal calling in via the AWS_IAM route with no entry here 403s
# with UNKNOWN_IAM_PRINCIPAL -- add an entry (and grant that principal
# execute-api:Invoke on the /iam/* route, see infra/README.md) before
# a new caller can use this path.

iam_principals: {}
# Emptied 2026-09-23: all 4 entries previously here (finance-manual-
# smoke-test and finance-manager-smoke-test, each as an exact role ARN
# and an assumed-role wildcard, all tenant_id: tenant1-finance) are
# confirmed already present in DynamoDB
# (gateway-principal-grants-dev), which LayeredIamTenantResolver checks
# first -- this file's copies had been dead weight, not a second
# source of truth, for some already-elapsed window before this cleanup
# (the exact cutover point isn't known; the mappings were found already
# migrated, not migrated by this change). See
# app/scripts/migrate_file_tenants_to_dynamodb.py's sibling tenant-
# policy migration for the same file-to-DynamoDB pattern -- no
# equivalent script exists for IAM principals since these were already
# fully migrated when this was checked.
#
# Add an entry back here (not just in DynamoDB) if you want it git-
# reviewed and/or need it to work in an environment with no live
# DynamoDB table yet (prod today).
#
# Examples only -- commented out; these do not grant access.
# To enable file-based mappings, replace "iam_principals: {}" above with
# the uncommented example block below (do not add a second root key).
# Keep the block commented while DynamoDB manages these grants.
#
# iam_principals:
#   # Application caller: exact IAM role ARN.
#   "arn:aws:iam::646821141010:role/finance-manual-smoke-test":
#     tenant_id: tenant1-finance
#     application_id: finance-manual-smoke-test
#     roles: [developer, operator]
#
#   # Same role assumed through STS; matches any session-name suffix
#   # in FileIamTenantResolver.
#   "arn:aws:sts::646821141010:assumed-role/finance-manual-smoke-test/*":
#     tenant_id: tenant1-finance
#     application_id: finance-manual-smoke-test
#     roles: [developer, operator]
#
#   # Tenant manager: permissions must be enforced by the consuming API.
#   "arn:aws:iam::646821141010:role/finance-manager-smoke-test":
#     tenant_id: tenant1-finance
#     application_id: finance-manager-smoke-test
#     roles: [manager]
#
#   "arn:aws:sts::646821141010:assumed-role/finance-manager-smoke-test/*":
#     tenant_id: tenant1-finance
#     application_id: finance-manager-smoke-test
#     roles: [manager]
