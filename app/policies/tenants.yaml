# ============================================================
# COPY -- not the source of truth. Canonical copy lives in
# github.com/taixingbi/platform-policy-definitions (environments/dev/).
# Sync by running scripts/sync-policies.sh against a checkout of
# that repo. This copy exists only so `docker build` here keeps
# working during the app/infra/policies repo split -- once the
# gateway has a working S3/DynamoDB-backed PolicyStore, this
# directory and the COPY step in Dockerfile go away entirely.
# ============================================================
# Dev tenant policies are managed in DynamoDB: gateway-tenant-policies-dev.
# The three policies below were verified against DynamoDB on 2026-09-23.
# Keep the file fallback empty so deleting a database policy cannot revive
# an older policy from the image. DynamoDB-backed deployments continue to
# load these tenants through LayeredPolicyStore.
#
# Local/file-only use: replace "tenants: {}" with the uncommented example
# block below. Do not add a second tenants key. These examples are a
# reference snapshot, not automatically synchronized with live updates.
# The YAML-to-DynamoDB migration script has no active tenants to import
# from this file unless examples are deliberately enabled.

tenants: {}

